name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - name: Build universal binaries (arm64 + x86_64)
        run: make all

      - name: Smoke test（端到端冒烟，含参数校验 / 配置往返 / 资产一致性）
        run: make test

      - name: Show doctor report
        run: ./build/blankscreen doctor || true

      - name: Verify architectures
        run: |
          lipo -info build/blankscreen
          lipo -info build/BlankScreenBar.app/Contents/MacOS/BlankScreenBar
          ./build/blankscreen version

      - name: Build installer (.pkg)
        run: make pkg

      - name: Build disk image (.dmg)
        run: make dmg

      - name: Package
        run: |
          mkdir -p dist
          cp build/blankscreen dist/
          cp -R build/BlankScreenBar.app dist/
          ditto -c -k --keepParent dist blankscreen-macos.zip

      - uses: actions/upload-artifact@v7
        with:
          name: blankscreen-macos
          path: blankscreen-macos.zip

      - uses: actions/upload-artifact@v7
        with:
          name: blankscreen-installer
          path: build/pkgout/BlankScreen-*.pkg

      - uses: actions/upload-artifact@v7
        with:
          name: blankscreen-dmg
          path: build/dmgout/BlankScreen-*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: macos-14
    permissions:
      contents: write
      id-token: write          # GitHub artifact attestation 必需
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - run: make all
      - name: Build installer (.pkg)
        run: make pkg VERSION=${{ github.ref_name }}
      - name: Build disk image (.dmg)
        run: make dmg VERSION=${{ github.ref_name }}
      - name: Package release
        run: |
          mkdir -p dist
          cp build/blankscreen dist/
          cp -R build/BlankScreenBar.app dist/
          ditto -c -k --keepParent dist blankscreen-macos.zip
          cp build/pkgout/BlankScreen-*.pkg .
          cp build/dmgout/BlankScreen-*.dmg .
          # 生成校验和：用户下载后可 `shasum -a 256 -c SHA256SUMS` 验证完整性
          shasum -a 256 blankscreen-macos.zip BlankScreen-*.pkg BlankScreen-*.dmg > SHA256SUMS
          cat SHA256SUMS
      # 构建来源证明（SLSA）：证明产物由本仓库的 workflow 构建，未经篡改
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            blankscreen-macos.zip
            BlankScreen-*.pkg
            BlankScreen-*.dmg
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            blankscreen-macos.zip
            BlankScreen-*.pkg
            BlankScreen-*.dmg
            SHA256SUMS
          generate_release_notes: true
